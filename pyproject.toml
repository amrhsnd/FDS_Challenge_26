[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fds-pokemon-challenge"
version = "0.1.0"
description = "Shared tools for the FDS Pokemon battle prediction team"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scikit-learn", "tqdm"]

[tool.setuptools.packages.find]
where = ["src"]
